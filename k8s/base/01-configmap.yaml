apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: fiap-tc-1
data:
  APP_NAME: "mecanica"
  APP_ENV: "production"
  # Com depuração ligada, uma exceção devolve a mensagem e o stack trace no **corpo da
  # resposta HTTP**, e o mascaramento de dados pessoais cobre só o log. Além disso a
  # resposta fica grande, não cabe nos buffers do Nginx e provoca um aviso no log de erro
  # dele que inclui a query string. Desligado, a resposta de erro é genérica; o detalhe
  # continua no log, em JSON e mascarado.
  APP_DEBUG: "false"
  APP_URL: "http://localhost"
  # Log em uma linha de JSON por registro, na saída padrão do container, que é de onde
  # o Grafana Alloy coleta. Ver config/logging.php e JsonLoggerFactory.
  LOG_CHANNEL: "json"
  # "dev" não é um nível do Monolog; os níveis válidos vão de debug a emergency.
  LOG_LEVEL: "info"
  DB_CONNECTION: "mysql"
  DB_HOST: "mysql"
  DB_PORT: "3306"
  JWT_TTL: "60"
  JWT_BLACKLIST_ENABLED: "true"
  CACHE_DRIVER: "file"
  MAIL_MAILER: "smtp"
  MAIL_HOST: "mailpit"
  MAIL_PORT: "1025"
  MAIL_ENCRYPTION: "null"
  MAIL_FROM_ADDRESS: "no-reply@mecanica.local"
  MAIL_FROM_NAME: "mecanica"
