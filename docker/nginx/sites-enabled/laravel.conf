# Nginx que serve a API.
#
# ATENÇÃO: este arquivo existe em duas cópias byte a byte idênticas — docker/nginx/
# (usada pelo Docker Compose) e k8s/base/nginx/ (vira ConfigMap no cluster, montado pelo
# kustomize). O pipeline falha se divergirem; ver o job "image" em .github/workflows/app.yml.
#
# Tudo aqui é incluído dentro do bloco `http` do nginx.conf, por isso `map` e `log_format`
# podem ficar neste arquivo e não no conf.d/default.conf.

# Identificador de correlação da requisição.
#
# Se o cliente mandou um X-Request-Id de formato aceitável, ele é reaproveitado — é o que
# permite acompanhar uma chamada que atravessa mais de um sistema. Senão, o Nginx gera um
# ($request_id = 32 caracteres hexadecimais).
#
# O valor é validado aqui, e não só na aplicação, porque ele vai para o log: texto
# arbitrário vindo do cliente dentro de um log é injeção de conteúdo. O mesmo formato está
# em App\Interfaces\Http\Middleware\RequestIdMiddleware; mudar aqui exige mudar lá.
map $http_x_request_id $request_id_final {
    "~^[A-Za-z0-9_.:-]{8,64}$" $http_x_request_id;
    default                    $request_id;
}

# Caminho da requisição, sem a query string.
#
# `$uri` não serve aqui: o `try_files` reescreve toda requisição da API para /index.php, e
# era isso que o log registraria. `$request_uri` guarda a requisição original, mas inclui a
# query string — e ela carrega o token de aprovação da ordem de serviço
# (GET /api/service-orders/approve?token=...), que não pode ir para o log.
#
# Então o que vai para o log é a parte antes do "?", extraída pela captura do regex.
#
# Isto cobre o access log, que é o log desta configuração. O log de erro do Nginx é outro
# arquivo, em texto puro, e registra a requisição original com query string — ver o
# comentário do `error_log` no bloco `server`.
map $request_uri $request_path {
    "~^(?<caminho_sem_query>[^?]*)" $caminho_sem_query;
    default                         $request_uri;
}

# Severidade da linha, com o mesmo significado que no log da aplicação: erro do servidor é
# "error", erro do cliente (401, 404, 422) é "warning", o resto é "info". Com isso o Grafana
# colore a linha pela severidade e uma única consulta de erros serve para as duas fontes.
map $status $log_level {
    "~^5" error;
    "~^4" warning;
    default info;
}

# Uma linha de JSON por requisição atendida, em stdout — é de lá que o Grafana Alloy lê.
#
# `escape=json` faz o Nginx escapar aspas e barras invertidas dos valores. Todos os campos
# são escritos como texto, mesmo os numéricos: `$status` vale "000" quando o cliente
# desiste da conexão antes da resposta, e `000` não é um número JSON válido — uma única
# linha malformada quebraria o parse no Grafana.
log_format json_access escape=json
    '{'
    '"timestamp":"$time_iso8601",'
    '"level":"$log_level",'
    '"channel":"nginx",'
    '"event":"http_access",'
    '"request_id":"$request_id_final",'
    '"method":"$request_method",'
    '"path":"$request_path",'
    '"status":"$status",'
    '"duration_seconds":"$request_time",'
    '"upstream_seconds":"$upstream_response_time",'
    '"bytes_sent":"$body_bytes_sent",'
    '"client_ip":"$remote_addr",'
    '"forwarded_for":"$http_x_forwarded_for",'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent"'
    '}';

upstream api_backend {
    server api:9000;
}

server {
    listen 80;
    server_name localhost;

    root /var/www/public;
    index index.php index.html;

    access_log /dev/stdout json_access;

    # Log de erro do Nginx — outro log, outro formato: texto puro, uma linha por problema,
    # e cada linha inclui a requisição **original**, com query string.
    #
    # A imagem oficial configura o nível `notice`, que registra também avisos benignos. Um
    # deles é "an upstream response is buffered to a temporary file", que acontece quando a
    # resposta não cabe nos buffers — e esse aviso levava o token de aprovação da ordem de
    # serviço para o log, apesar de o access log acima registrar só o caminho.
    #
    # `error` registra o que de fato precisa de investigação e deixa os avisos de fora.
    # Reduz a exposição ao mínimo, mas não a elimina: uma linha de `[error]` legítima
    # continua carregando a query string. O que elimina de verdade é o token deixar de
    # viajar na query string; está registrado como limitação conhecida no ADR-0002.
    error_log stderr error;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        fastcgi_pass api_backend;

        # Buffers grandes o suficiente para a resposta caber na memória. Quando não cabe, o
        # Nginx grava num arquivo temporário e avisa no log de erro — e era esse aviso que
        # vazava a query string. 16 x 32k = 512k, suficiente para uma resposta de erro com
        # stack trace. Ver o comentário do `error_log` no bloco `server`.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 32k;

        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Chega no PHP como $_SERVER['REQUEST_ID'] e é lido pelo RequestIdMiddleware, que
        # usa o mesmo valor em todas as linhas de log da aplicação.
        fastcgi_param REQUEST_ID $request_id_final;
    }

    # Endpoint do stub_status, usado pelas probes do Kubernetes a cada 10 segundos em cada
    # pod. Fora do log: seria o endpoint mais acessado da API e consumiria a cota de
    # ingestão do Grafana Cloud com ruído.
    location /nginx_status {
        stub_status;
        allow all;
        access_log off;
    }
}
