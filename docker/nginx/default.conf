# Único papel deste arquivo: carregar a configuração do site, que está em sites-enabled.
#
# ATENÇÃO: este arquivo existe em duas cópias byte a byte idênticas — docker/nginx/ (usada
# pelo Docker Compose) e k8s/base/nginx/ (vira ConfigMap no cluster). O pipeline falha se
# divergirem; ver o job "image" em .github/workflows/app.yml.
#
# A diretiva `resolver 127.0.0.11 ipv6=off` (DNS interno do Docker) que existia aqui foi
# removida: ela só vale para nomes resolvidos em tempo de execução, a partir de variável.
# O upstream deste projeto é fixo (`server api:9000`) e é resolvido na subida do Nginx,
# pelo /etc/resolv.conf do container — a diretiva nunca teve efeito.

include /etc/nginx/sites-enabled/*;
