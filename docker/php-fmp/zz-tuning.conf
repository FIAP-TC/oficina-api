; Este arquivo é lido depois do docker.conf da imagem oficial (ordem alfabética do
; /usr/local/etc/php-fpm.d/*.conf), então o que está aqui sobrepõe o padrão dela.

[global]
; Tamanho máximo de uma linha de log do PHP-FPM. O padrão da imagem oficial é 8192, e um
; registro em JSON com stack trace passa disso: o FPM quebraria a linha em duas e o Loki
; receberia dois pedaços de JSON inválido.
log_limit = 32768

[www]
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; A imagem oficial liga o access log do próprio FPM apontando para a saída de erro
; (access.log = /proc/self/fd/2), que é o mesmo lugar onde a aplicação grava o log em JSON.
; Seria uma linha de texto puro por requisição no meio do fluxo JSON, com informação que já
; existe em dois lugares melhores: o access log do Nginx (latência vista de fora) e o log da
; aplicação (rota e usuário). Por isso fica desligado.
access.log = /dev/null

; Mantido explícito porque todo o log da aplicação depende disto: o processo filho escreve
; em php://stderr, o processo mestre captura e repassa para a saída padrão do container,
; sem prefixo nenhum (senão a linha deixaria de ser JSON válido).
catch_workers_output = yes
decorate_workers_output = no
